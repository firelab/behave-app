name: CLJ tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  clj-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-clj-${{ hashFiles('deps.edn', 'projects/behave/deps.edn') }}
          restore-keys: cljdeps-

      - name: Prefetch deps
        working-directory: projects/behave
        run: clojure -P -M:clj-test

      # JVM-side tests under projects/behave/test/clj (cognitect test-runner).
      # The runner exits 0 when it finds no tests, so also require a non-zero
      # "Ran N tests" line rather than trusting the exit code alone.
      - name: Run CLJ test suite
        working-directory: projects/behave
        run: |
          set -o pipefail
          bb test:clj 2>&1 | tee clj-tests.log
          grep -Eq '^Ran [1-9][0-9]* tests' clj-tests.log
