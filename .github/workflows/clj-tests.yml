name: CLJ tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  clj-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-poly-${{ hashFiles('**/deps.edn') }}
          restore-keys: cljdeps-

      # The behave-docs submodule has no deps.edn, which poly needs.
      - name: Stub behave-docs submodule for Polylith
        run: |
          mkdir -p bases/behave-docs
          [ -f bases/behave-docs/deps.edn ] || echo '{:paths [] :deps {}}' > bases/behave-docs/deps.edn

      - name: Prefetch deps
        run: clojure -P -M:poly

      - name: Validate workspace (poly check)
        run: clojure -M:poly check color-mode:none

      # A run with no tests exits 0, so require at least one pass.
      - name: Run all Polylith tests (poly test :all)
        run: |
          set -o pipefail
          clojure -M:poly test :all color-mode:none 2>&1 | tee poly-test.log
          grep -Eq 'Test results: [1-9][0-9]* passes' poly-test.log
